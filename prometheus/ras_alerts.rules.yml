# RQ2 Prometheus alerting rules - DERIVED from Phase 1 baseline data.
# Generated by derive_thresholds.py from 5 baseline sessions.
# Every threshold below traces to a stated derivation rule; none is assumed.

groups:
  - name: ras_fault_detection
    rules:
      - alert: DroneLowBattery
        expr: ras_battery_percent < 31
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: "Battery approaching the auto-land point"
          description: "Below 31% - roughly 2 min of lead time at the worst observed depletion rate of 10.50 %/min."

      - alert: DroneOverTemperature
        expr: (ras_temperature_high_c > 64) and on() ras_tof_cm > 20
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: "Onboard temperature above the in-flight baseline"
          description: "Above the 99th percentile of the settled region of normal flight, 64 C. Derived from the last 90s of each baseline session, because the aircraft warms toward an operating point and the earlier transient would depress the percentile below the range it actually occupies. One-sided: the fault direction for temperature is high. Evaluated only while airborne, because the Tello is hottest at power-on and cools under rotor airflow, so ground samples sit above the in-flight range on a healthy aircraft."

      - alert: DroneUnstableAttitude
        expr: stddev_over_time(ras_pitch_deg[5s]) > 3.87 or stddev_over_time(ras_roll_deg[5s]) > 1.20
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: "Attitude dispersion above baseline"
          description: "Rolling 5s standard deviation exceeded the 99th percentile of normal flight - controlled manoeuvring does not disperse this much."

      - alert: DronePollFailure
        expr: ras_last_poll_success == 0 or up{job="ras_drone_live"} == 0
        for: 2s
        labels:
          severity: critical
        annotations:
          summary: "Lost contact with the drone"
          description: "Liveness is binary and needs no derivation: missing data is itself the fault condition."

